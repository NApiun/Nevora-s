<title>Painel Névora</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: barra lateral com navegação por área + área de trabalho; ficha do cliente em gaveta lateral */
:root{
  --bg:#eef1f3; --surface:#ffffff; --surface-2:#f5f7f8; --line:#d9dfe3;
  --fg:#18232b; --muted:#5d6b75; --accent:#1f5f6b; --accent-soft:#dcebed; --accent-fg:#ffffff;
  --ok:#2f7a4b; --ok-soft:#e1f1e6; --warn:#a8660b; --warn-soft:#fbefd9; --bad:#b2392f; --bad-soft:#f8e1de;
  --t-social:#9b4d7a; --t-estrutura:#1f5f6b; --t-nfc:#7a5c12;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"IBM Plex Sans",ui-sans-serif,system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#11181d; --surface:#18222a; --surface-2:#1e2a33; --line:#2c3a44;
  --fg:#e3eaee; --muted:#93a3ad; --accent:#5fb3bf; --accent-soft:#1d3a40; --accent-fg:#0d1a1e;
  --ok:#6cc48d; --ok-soft:#1b3326; --warn:#e3a54b; --warn-soft:#3a2c14; --bad:#ec8378; --bad-soft:#3d1f1c;
  --t-social:#e08bbb; --t-estrutura:#5fb3bf; --t-nfc:#d9b45a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11181d; --surface:#18222a; --surface-2:#1e2a33; --line:#2c3a44;
  --fg:#e3eaee; --muted:#93a3ad; --accent:#5fb3bf; --accent-soft:#1d3a40; --accent-fg:#0d1a1e;
  --ok:#6cc48d; --ok-soft:#1b3326; --warn:#e3a54b; --warn-soft:#3a2c14; --bad:#ec8378; --bad-soft:#3d1f1c;
  --t-social:#e08bbb; --t-estrutura:#5fb3bf; --t-nfc:#d9b45a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:14px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
aside{background:var(--surface);border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:20px;position:sticky;top:0;height:100vh}
.brand{font-family:var(--display);font-size:24px;font-weight:700;letter-spacing:-.02em;padding:0 8px}
.brand small{display:block;font-family:var(--body);font-size:11px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
nav{display:flex;flex-direction:column;gap:2px}
nav button{all:unset;cursor:pointer;padding:9px 10px;border-radius:6px;color:var(--muted);font-weight:500;display:flex;justify-content:space-between;gap:8px}
nav button:hover{background:var(--surface-2);color:var(--fg)}
nav button[aria-current="true"]{background:var(--accent-soft);color:var(--fg)}
nav .count{font-family:var(--mono);font-size:12px}
nav .count.bad{color:var(--bad)}
.who{margin-top:auto;display:flex;flex-direction:column;gap:6px}
.who label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
select,input,textarea{background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:8px 10px;width:100%}
textarea{min-height:64px;resize:vertical}
main{padding-block:24px 48px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));min-width:0;display:flex;flex-direction:column;gap:20px}
.top{display:flex;flex-wrap:wrap;gap:12px;align-items:end;justify-content:space-between}
h1{font-family:var(--display);font-weight:700;font-size:30px;letter-spacing:-.02em;margin:0;text-wrap:balance}
.sub{color:var(--muted);margin:2px 0 0}
.btn{cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:8px 14px;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.sm{padding:4px 10px;font-size:12px}
.demo{font-size:12px;color:var(--warn);background:var(--warn-soft);padding:6px 10px;border-radius:6px}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;align-items:center}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px;min-width:0}
.kpi .l{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.kpi .v{font-family:var(--display);font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .h{font-size:12px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;min-width:0}
.panel h2{font-family:var(--display);font-size:17px;font-weight:700;margin:0 0 12px}
.alerts{display:flex;flex-direction:column;gap:8px;list-style:none;margin:0;padding:0}
.alerts li{display:flex;gap:10px;align-items:baseline;padding:8px 10px;border-radius:6px;background:var(--surface-2);cursor:pointer}
.alerts li:hover{outline:1px solid var(--line)}
.alerts .d{font-family:var(--mono);font-size:12px;white-space:nowrap;min-width:70px}
.late{color:var(--bad)} .today{color:var(--warn)}
.teams{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.team{border-top:3px solid var(--tc);padding-top:8px;display:flex;flex-direction:column;gap:4px}
.team b{font-family:var(--display);font-size:15px}
.team span{font-size:12px;color:var(--muted)}
.team .big{font-family:var(--mono);font-size:20px;color:var(--fg)}
/* abas */
.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.tabs button{all:unset;cursor:pointer;padding:8px 12px;border-bottom:2px solid transparent;color:var(--muted);font-weight:500;display:flex;gap:6px;align-items:center}
.tabs button[aria-selected="true"]{color:var(--fg);border-color:var(--tc,var(--accent))}
.tdot{width:8px;height:8px;border-radius:50%;background:var(--tc)}
/* quadro */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(220px,1fr);gap:12px;overflow-x:auto;padding-bottom:8px}
.col{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:200px}
.col.over{outline:2px dashed var(--accent)}
.col header{display:flex;justify-content:space-between;font-weight:600;font-size:13px;padding:2px 4px 6px}
.col header span{font-family:var(--mono);color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--tc);border-radius:6px;padding:10px;cursor:grab;display:flex;flex-direction:column;gap:6px}
.card:hover{border-color:var(--accent);border-left-color:var(--tc)}
.card .nm{font-weight:600}
.card .sv{font-size:13px}
.card .desc{font-size:12px;color:var(--muted)}
.meta{display:flex;flex-wrap:wrap;gap:4px}
.chip{font-size:11px;padding:2px 7px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);white-space:nowrap}
.chip.ok{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.chip.no{background:var(--bad-soft);border-color:transparent;color:var(--bad)}
.chip.wa{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.chip.team{border-color:var(--tc);color:var(--tc);background:transparent}
.card .foot{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);gap:8px}
.av{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--accent-fg);font-size:10px;font-weight:600;flex:none}
/* tabelas */
.filters{display:flex;flex-wrap:wrap;gap:8px}
.filters>*{width:auto;flex:1 1 160px}
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;min-width:760px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500;background:var(--surface-2)}
tbody tr[data-open]{cursor:pointer} tbody tr:hover{background:var(--surface-2)}
td.num,th.num{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right}
.steps{display:flex;gap:3px;align-items:center}
.steps i{width:18px;height:6px;border-radius:3px;background:var(--line)}
.steps i.on{background:var(--t-nfc)}
.score{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:12px}
.dots{display:inline-flex;gap:2px}.dots i{width:7px;height:7px;border-radius:2px;background:var(--line)}.dots i.on{background:var(--accent)}
/* gaveta */
.scrim{position:fixed;inset:0;background:rgba(10,20,25,.35);z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(620px,100%);background:var(--surface);border-left:1px solid var(--line);z-index:21;overflow-y:auto;padding-block:calc(20px + env(safe-area-inset-top,0px)) calc(28px + env(safe-area-inset-bottom,0px));padding-left:22px;padding-right:max(22px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
.drawer h2{font-family:var(--display);font-size:22px;margin:0}
.dhead{display:flex;justify-content:space-between;gap:12px;align-items:start}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form .full{grid-column:1/-1}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field>span{font-size:12px;font-weight:500;color:var(--muted)}
.hint{font-size:12px;color:var(--muted)}
.hint.wa{color:var(--warn)}
.checks{display:flex;flex-wrap:wrap;gap:6px}
.checks label{display:flex;gap:6px;align-items:center;font-size:13px;padding:5px 9px;border:1px solid var(--line);border-radius:999px;cursor:pointer}
.checks input{width:auto}
.checks label:has(input:checked){background:var(--accent-soft);border-color:var(--accent)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg label{flex:1;text-align:center;border:1px solid var(--line);border-radius:6px;padding:7px;cursor:pointer;font-size:13px;position:relative;white-space:nowrap}
.seg input{position:absolute;opacity:0;width:1px;pointer-events:none}
.seg label:has(input:checked){background:var(--accent-soft);border-color:var(--accent)}
.diag{background:var(--surface-2);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:6px}
.diag b{font-family:var(--display);font-size:16px}
.diag ul{margin:0;padding-left:18px;font-size:13px;color:var(--muted)}
h3{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:6px 0 0;font-weight:600}
.svlist{display:flex;flex-direction:column;gap:8px}
.svitem{border:1px solid var(--line);border-left:3px solid var(--tc);border-radius:6px;padding:10px 12px;display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center}
.svitem .t{font-weight:600}
.svitem .s{font-size:12px;color:var(--muted)}
.svitem .v{font-family:var(--mono);font-size:12px;text-align:right}
.addsv{background:var(--surface-2);border:1px dashed var(--line);border-radius:8px;padding:12px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.addsv .full{grid-column:1/-1}
.nfcgrid{display:grid;grid-template-columns:1fr 80px;gap:6px 10px;align-items:center}
.nfcgrid label{display:flex;gap:8px;align-items:center;font-size:13px}
.nfcgrid input[type=checkbox]{width:auto}
.hist{list-style:none;margin:0;padding:0;border-left:2px solid var(--line);display:flex;flex-direction:column;gap:10px}
.hist li{padding-left:12px;font-size:13px}
.hist time{display:block;font-family:var(--mono);font-size:11px;color:var(--muted)}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:6px;z-index:30;font-weight:500}
.empty{color:var(--muted);padding:12px}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  aside{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  nav{flex-direction:row;flex-wrap:wrap}
  .who{margin:0;flex:1 1 180px}
  main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid2,.teams{grid-template-columns:1fr}
  .form,.addsv{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:no-preference){.drawer{animation:in .18s ease-out}@keyframes in{from{transform:translateX(24px);opacity:.6}}}
[hidden]{display:none!important}
.drawer.narrow{width:min(480px,100%)}
.chip.solid{background:var(--ok);color:var(--surface)}
.fgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.fgrid>*{width:auto}
fieldset[disabled] input,fieldset[disabled] select,fieldset[disabled] textarea{opacity:.75}
@media (max-width:900px){.fgrid{grid-template-columns:1fr 1fr}}
.task{border:1px solid var(--line);border-left:4px solid var(--tc,var(--line));border-radius:10px;padding:10px 12px;background:var(--surface);display:flex;flex-direction:column;gap:6px}
.task.done{opacity:.6}
.task.done .task-main b{text-decoration:line-through}
.task-top{display:flex;gap:10px;align-items:flex-start}
.tcheck{width:20px;height:20px;flex:none;margin-top:2px;cursor:pointer}
.task-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.linkbtn{all:unset;cursor:pointer;color:var(--accent,inherit);text-decoration:underline;font-size:13px}
.linkbtn:focus-visible{outline:2px solid currentColor}
.tasks-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
.tasks-grid.one{grid-template-columns:1fr}
.tgroup{margin-bottom:18px}
.tgroup h2{font-size:14px;margin:0 0 8px}
.chip.pri-urgente{background:var(--bad);color:var(--surface)}
.chip.pri-alta{background:var(--warn);color:var(--surface)}
.progress{height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.progress i{display:block;height:100%;background:var(--ok)}
.minitasks{list-style:none;padding:0;margin:4px 0 0;font-size:13px}
.minitasks li.done{text-decoration:line-through;opacity:.6}
.seg.wrap{flex-wrap:wrap}
.aprov{border:1px solid var(--line);border-left:4px solid var(--tc,var(--line));border-radius:10px;padding:12px;margin-bottom:10px;background:var(--surface)}
.preview{border:1px dashed var(--line);border-radius:10px;padding:12px;margin-top:10px}
</style>

<div class="app">
  <aside>
    <div class="brand">Névora<small>Painel interno</small></div>
    <nav id="nav">
      <button data-view="tarefas">Minhas tarefas <span class="count" id="cTar"></span></button>
      <button data-view="geral">Visão geral</button>
      <button data-view="producao">Produção</button>
      <button data-view="nfc">Placas NFC</button>
      <button data-view="clientes">Clientes</button>
      <button data-view="aprovacoes" data-only="gestao">Aprovações <span class="count" id="cApr"></span></button>
      <button data-view="financeiro" data-only="gestao">Financeiro <span class="count bad" id="cFin"></span></button>
      <button data-view="comissoes" data-only="gestao">Comissões <span class="count" id="cCom"></span></button>
      <button data-view="meufin" data-only="colab">Meu financeiro</button>
    </nav>
    <div class="who">
      <label for="me">Você está como</label>
      <select id="me"></select>
    </div>
  </aside>
  <main id="main"></main>
</div>
<div id="layer"></div>

<script>
/* ---------- configuração ---------- */
const TEAMS={
  estrutura:{nome:"Produção",cor:"var(--t-estrutura)",etapas:["Briefing","Desenvolvimento","Aprovação do cliente","Entregue"]},
  social:{nome:"Social media",cor:"var(--t-social)",etapas:["Briefing","Planejamento","Produzindo conteúdo","Rodando"]},
  nfc:{nome:"Placas NFC",cor:"var(--t-nfc)",etapas:["Venda fechada","Arte","Na gráfica","Pronta","Instalada"]}
};
const PEOPLE=[
  {nome:"Gestão",equipe:null},
  {nome:"Bruno Lima",equipe:"estrutura",dev:true},{nome:"Felipe Rocha",equipe:"estrutura",dev:true},{nome:"Gabriel Nunes",equipe:"estrutura",dev:true},
  {nome:"Ana Costa",equipe:"social"},{nome:"Carla Reis",equipe:"social"}
];
const DEVS=PEOPLE.filter(p=>p.dev).map(p=>p.nome);
const COLABS=PEOPLE.filter(p=>p.equipe).map(p=>p.nome);
const ORIGENS={colaborador:"Colaborador",nevora:"Névora",gestor:"Gestor",parceiro:"Parceiro"};
// Regra vigente (no banco fica versionada; cada contrato guarda a sua)
const REGRA={versao:1,projNevora:5000,projDevs:5000,mensCaptador:6000,mensNevora:4000};
const CATALOG=[
  {id:"site",nome:"Site / landing page",equipe:"estrutura",mensal:true,desc:"Mensalidade cobre hospedagem, domínio e segurança"},
  {id:"bot",nome:"Automação de WhatsApp",equipe:"estrutura",mensal:true,desc:"Robô com menu, pedidos, agendamentos e lembretes"},
  {id:"painel",nome:"Painel administrativo",equipe:"estrutura",mensal:true},
  {id:"cardapio",nome:"Cardápio digital",equipe:"estrutura",mensal:true},
  {id:"wpp",nome:"Estrutura de WhatsApp Business",equipe:"estrutura",mensal:false,desc:"Perfil, catálogo, boas-vindas, respostas rápidas, etiquetas e QR code"},
  {id:"gmn",nome:"Google Meu Negócio",equipe:"estrutura",mensal:false},
  {id:"ig",nome:"Gestão de Instagram",equipe:"social",mensal:true},
  {id:"redes",nome:"Gestão de redes sociais",equipe:"social",mensal:true},
  {id:"placa",nome:"Placas NFC",equipe:"nfc",mensal:true}
];
const NFC_TIPOS=[{id:"google",nome:"Avaliação no Google"},{id:"insta",nome:"Instagram"},{id:"cardapio",nome:"Cardápio"},{id:"pix",nome:"PIX"},{id:"perso",nome:"Personalizada"}];
const NFC_PADRAO={custo:15,preco:50,com:10};
const STATUS_CLI=["Lead","Em negociação","Ativo","Pausado","Cancelado"];
const ST_COM={prevista:"Prevista",pendente:"Pendente de recebimento",liberada:"Liberada",paga:"Paga",ajustada:"Ajustada",cancelada:"Cancelada"};
const PRIOR={baixa:"Baixa",media:"Média",alta:"Alta",urgente:"Urgente"};
const ST_TAR={a_fazer:"A fazer",fazendo:"Fazendo",revisao:"Em revisão",concluida:"Concluída"};
// Modelos de tarefa por serviço (iguais aos do banco)
const MODELOS={
  site:[["Briefing com o cliente","estrutura",2,"alta",false],["Layout das páginas","estrutura",5,"media",true],["Aprovação do layout pelo cliente","estrutura",3,"media",true],["Desenvolvimento do site","estrutura",7,"media",true],["Publicação e domínio","estrutura",2,"alta",true],["Divulgar o site no Instagram do cliente","social",3,"media",true]],
  bot:[["Mapear o atendimento do cliente","estrutura",2,"alta",false],["Montar o fluxo do robô","estrutura",5,"media",true],["Testar com o cliente","estrutura",3,"media",true],["Ativar e acompanhar a primeira semana","estrutura",7,"media",true]],
  cardapio:[["Receber itens, fotos e preços","estrutura",2,"alta",false],["Montar o cardápio","estrutura",3,"media",true],["Aprovação do cliente","estrutura",2,"media",true],["Publicar e gerar QR code e NFC","estrutura",1,"media",true]],
  placa:[["Arte das placas","nfc",2,"alta",false],["Aprovação da arte pelo cliente","nfc",2,"media",true],["Enviar para a gráfica","nfc",1,"media",true],["Programar as placas","nfc",2,"media",true],["Entregar e instalar no cliente","nfc",3,"media",true]],
  ig:[["Briefing e identidade do perfil","social",3,"alta",false],["Planejamento do mês","social",3,"media",true],["Produção do conteúdo do mês","social",7,"media",true]]
};

const today=new Date();today.setHours(0,0,0,0);
const d=n=>{const x=new Date(today);x.setDate(x.getDate()+n);return x.toISOString().slice(0,10)};
const cat=id=>CATALOG.find(c=>c.id===id);
const cents=v=>Math.round((+v||0)*100);

/* ---------- regras de distribuição (espelho das funções do banco) ---------- */
function distribuir(total,pesos){
  const s=pesos.reduce((a,b)=>a+b,0),raw=pesos.map(p=>total*p/s),res=raw.map(Math.floor);
  let resto=total-res.reduce((a,b)=>a+b,0);
  const ord=raw.map((r,i)=>[r-Math.floor(r),i]).sort((a,b)=>b[0]-a[0]||a[1]-b[1]);
  for(let k=0;k<resto;k++)res[ord[k][1]]++;
  return res;
}
const nfcTotal=(sv,k)=>(sv.nfc||[]).reduce((a,n)=>a+n.q*cents(n[k]),0);
function feeCaptacao(sv){ // centavos
  if(sv.equipe==="nfc")return ["colaborador","parceiro"].includes(sv.origem)?nfcTotal(sv,"com"):0;
  return cents(sv.fee);
}
function captacaoFixa(sv){return feeCaptacao(sv)>0&&(sv.origem==="parceiro"||(sv.origem==="colaborador"&&!(sv.equipe==="estrutura"&&DEVS.includes(sv.captador))))}
function calcular(tipo,sv,base,cap=0){
  let L;
  if(sv.equipe!=="estrutura")L=[{benef:"nevora",pct:100,valor:base}];
  else if(tipo==="projeto"){
    const devs=sv.devs?.length?sv.devs:DEVS;
    const [nev,pool]=distribuir(base,[REGRA.projNevora,REGRA.projDevs]),partes=distribuir(pool,devs.map(()=>1));
    L=[{benef:"nevora",pct:REGRA.projNevora/100,valor:nev},...devs.map((n,i)=>({benef:"colab",colab:n,pct:+(REGRA.projDevs/100/devs.length).toFixed(4),valor:partes[i]}))];
  }else if(sv.origem==="colaborador"&&DEVS.includes(sv.captador)){
    const [c,n]=distribuir(base,[REGRA.mensCaptador,REGRA.mensNevora]);
    L=[{benef:"colab",colab:sv.captador,pct:REGRA.mensCaptador/100,valor:c},{benef:"nevora",pct:REGRA.mensNevora/100,valor:n}];
  }else L=[{benef:"nevora",pct:100,valor:base}];
  L.forEach(l=>l.natureza="distribuicao");
  if(cap>0){const n=L.find(l=>l.benef==="nevora"),v=Math.min(cap,n.valor);n.valor-=v;if(base>0)n.pct=+(n.valor*100/base).toFixed(4);
    if(v>0)L.push(sv.origem==="parceiro"?{benef:"parceiro",parceiro:sv.parceiro,natureza:"captacao",valor:v,pct:+(v*100/base).toFixed(4)}:{benef:"colab",colab:sv.captador,natureza:"captacao",valor:v,pct:+(v*100/base).toFixed(4)})}
  return L;
}
// Prévia do contrato inteiro (não grava nada)
function previa(sv){
  const bp=cents(sv.unico)-nfcTotal(sv,"custo"),bm=cents(sv.mensal),fee=captacaoFixa(sv)?feeCaptacao(sv):0;
  return {proj:bp>0?calcular("projeto",sv,bp,fee):[],mens:bm>0?calcular("mensalidade",sv,bm,cents(sv.unico)>0?0:fee):[]};
}

const nid=st=>st.seq++;
const cliByIdS=(st,id)=>st.clientes.find(c=>c.id===id);
function ativarServico(st,c,s,silencioso){
  s.status="ativo";
  if(s.equipe==="nfc"){s.unico=nfcTotal(s,"preco")/100}
  if(cents(s.unico)>0)distribuir(cents(s.unico),Array(s.parcelas||1).fill(1)).forEach((v,i)=>{const dt=new Date(s.inicio+"T00:00");dt.setMonth(dt.getMonth()+i);st.pag.push({id:nid(st),cli:c.id,sv:s.id,tipo:"Único",desc:cat(s.tipo).nome+" (projeto"+((s.parcelas||1)>1?` ${i+1}/${s.parcelas}`:"")+")",valor:v/100,venc:dt.toISOString().slice(0,10),status:"aberta"})});
  if(cents(s.mensal)>0){const ini=new Date(s.inicio+"T00:00");for(let m=0;;m++){const v=new Date(ini.getFullYear(),ini.getMonth()+m,s.dia||10);if(v>new Date(today.getFullYear(),today.getMonth()+1,0))break;if(v<new Date(ini.getFullYear(),ini.getMonth(),1))continue;st.pag.push({id:nid(st),cli:c.id,sv:s.id,tipo:"Mensal",desc:cat(s.tipo).nome+" (mensalidade)",valor:s.mensal,venc:v.toISOString().slice(0,10),status:"aberta"})}}
  // tarefas a partir do modelo
  let prazo=new Date(today),ant=null;
  (MODELOS[s.tipo]||[]).forEach(([titulo,setor,dias,prior,dep],i)=>{prazo.setDate(prazo.getDate()+dias);
    let resp=null;if(setor==="nfc")resp=s.criadoPor!=="Gestão"?s.criadoPor:s.resp;else if(setor==="estrutura"&&s.equipe==="estrutura"&&s.devs.length===1)resp=s.devs[0];else if(setor===s.equipe&&person(s.criadoPor)?.equipe===setor)resp=s.criadoPor;
    const t={id:nid(st),cli:c.id,sv:s.id,titulo,setor,resp,prazo:prazo.toISOString().slice(0,10),prioridade:prior,status:"a_fazer",dep:dep?ant:null,ordem:i+1,criadoPor:"Gestão",comentarios:[]};st.tar.push(t);ant=t.id});
  if(!silencioso){c.hist.push({em:d(0),txt:"Gestão aprovou "+cat(s.tipo).nome});log("aprovou "+cat(s.tipo).nome+" de "+c.nome)}
}
function saldoPag(st,p){return cents(p.valor)-st.rec.filter(r=>r.pag===p.id).reduce((a,r)=>a+r.valor,0)}
function capDoRecebimento(st,c,s,tipo){
  if(!captacaoFixa(s))return 0;const fee=feeCaptacao(s);
  const ja=st.com.filter(l=>l.cli===c.id&&l.sv===s.id&&l.natureza==="captacao").reduce((a,l)=>a+l.valor,0);
  if(cents(s.unico)>0){if(tipo!=="projeto")return 0;const rec=st.rec.filter(r=>{const p=st.pag.find(x=>x.id===r.pag);return p.cli===c.id&&p.sv===s.id&&p.tipo==="Único"}).reduce((a,r)=>a+r.valor,0);return Math.max(0,Math.floor(fee*rec/cents(s.unico))-ja)}
  return Math.max(0,fee-ja);
}
function receber(st,pagId,f,silencioso){
  const p=st.pag.find(x=>x.id===pagId);
  if(f.ref&&st.rec.some(r=>r.ref===f.ref))return {erro:"Este pagamento já foi registrado (referência repetida). Nada foi duplicado."};
  if(p.status==="cancelada")return {erro:"Cobrança cancelada não recebe pagamento."};
  const valor=cents(f.valor),imp=cents(f.imp),tax=cents(f.tax);
  if(valor<=0)return {erro:"Informe o valor recebido."};
  if(valor>saldoPag(st,p))return {erro:"Valor maior que o saldo da cobrança ("+brlc(saldoPag(st,p))+")."};
  const c=cliByIdS(st,p.cli),s=svById(c,p.sv),tipo=p.tipo==="Único"?"projeto":"mensalidade";
  let custo=f.custo!==undefined&&f.custo!==""?cents(f.custo):0;
  if((f.custo===undefined||f.custo==="")&&s.equipe==="nfc"&&tipo==="projeto"){const tot=st.rec.filter(r=>{const q=st.pag.find(x=>x.id===r.pag);return q.cli===c.id&&q.sv===s.id&&q.tipo==="Único"}).reduce((a,r)=>a+r.valor,0),ct=nfcTotal(s,"custo"),vp=cents(s.unico);custo=Math.floor(ct*(tot+valor)/vp)-Math.floor(ct*tot/vp)}
  const base=valor-imp-tax-custo;if(base<0)return {erro:"Impostos, taxas e custos passam do valor recebido."};
  const r={id:nid(st),pag:p.id,valor,imp,tax,custo,base,em:f.em||d(0),forma:f.forma,ref:f.ref||null,estorno_de:null};
  st.rec.push(r);
  calcular(tipo,s,base,capDoRecebimento(st,c,s,tipo)).forEach(l=>st.com.push({id:nid(st),rec:r.id,cli:c.id,sv:s.id,tipo,benef:l.benef,colab:l.colab||null,parceiro:l.parceiro||null,natureza:l.natureza,origem:s.origem,captador:s.captador,base,pct:l.pct,valor:l.valor,comp:p.venc.slice(0,7),em:r.em,status:"liberada",ajuste_de:null,repasse:null}));
  p.status=saldoPag(st,p)<=0?"paga":"parcial";
  if(!silencioso){c.hist.push({em:d(0),txt:"Gestão registrou recebimento de "+brlc(valor)+" ("+p.desc+")"});log("registrou recebimento de "+c.nome)}
  return {ok:r};
}
function estornar(st,recId,motivo){
  const o=st.rec.find(r=>r.id===recId);
  if(st.rec.some(r=>r.estorno_de===recId))return {erro:"Este recebimento já foi estornado."};
  const e={id:nid(st),pag:o.pag,valor:-o.valor,imp:-o.imp,tax:-o.tax,custo:-o.custo,base:-o.base,em:d(0),forma:o.forma,ref:null,estorno_de:o.id,motivo};
  st.rec.push(e);
  st.com.filter(c=>c.rec===o.id&&!c.ajuste_de).forEach(c=>st.com.push({...c,id:nid(st),rec:e.id,base:-c.base,valor:-c.valor,em:d(0),status:"ajustada",ajuste_de:c.id,repasse:null}));
  const p=st.pag.find(x=>x.id===o.pag);p.status=saldoPag(st,p)>=cents(p.valor)?"aberta":"parcial";
  const c=cliByIdS(st,p.cli);c.hist.push({em:d(0),txt:"Gestão estornou "+brlc(o.valor)+": "+motivo});log("estornou recebimento de "+c.nome);
  return {ok:e};
}
const chaveBenef=l=>l.benef==="parceiro"?"p:"+l.parceiro:"c:"+l.colab;
function repassar(st,chave,ids,f,silencioso){
  const linhas=st.com.filter(c=>ids.includes(c.id));
  if(linhas.some(c=>chaveBenef(c)!==chave||!["liberada","ajustada"].includes(c.status)||c.repasse))return {erro:"Só comissões liberadas de uma mesma pessoa entram no repasse."};
  const total=linhas.reduce((a,c)=>a+c.valor,0);if(total<0)return {erro:"O repasse ficou negativo."};
  const rp={id:nid(st),chave,valor:total,em:f.em||d(0),forma:f.forma,ref:f.ref,aprovado:"Gestão"};
  st.rep.push(rp);linhas.forEach(c=>{c.repasse=rp.id;if(c.status==="liberada")c.status="paga"});
  if(!silencioso)log("registrou repasse de "+brlc(total));
  return {ok:rp};
}
function previstas(){
  return state.pag.filter(p=>p.status==="aberta"||p.status==="parcial").flatMap(p=>{
    const c=cliById(p.cli),s=svById(c,p.sv);if(!s||s.status!=="ativo")return [];
    const saldo=saldoPag(state,p),tipo=p.tipo==="Único"?"projeto":"mensalidade";
    const base=saldo-(s.equipe==="nfc"&&tipo==="projeto"?Math.floor(nfcTotal(s,"custo")*saldo/cents(s.unico)):0);
    const cap=!captacaoFixa(s)?0:cents(s.unico)>0?(tipo==="projeto"?Math.floor(feeCaptacao(s)*saldo/cents(s.unico)):0):Math.max(0,feeCaptacao(s)-state.com.filter(l=>l.sv===s.id&&l.cli===c.id&&l.natureza==="captacao").reduce((a,l)=>a+l.valor,0));
    return calcular(tipo,s,base,cap).map(l=>({id:"p"+p.id+(l.colab||l.parceiro||"n")+l.natureza,prev:true,cli:c.id,sv:s.id,tipo,benef:l.benef,colab:l.colab||null,parceiro:l.parceiro||null,natureza:l.natureza,origem:s.origem,captador:s.captador,base,pct:l.pct,valor:l.valor,comp:p.venc.slice(0,7),em:null,venc:p.venc,status:p.venc<d(0)?"pendente":"prevista"}));
  });
}

      ${L.tipo?`<label class="field full"><span>${sv.equipe==="nfc"?"Automação personalizada / descrição":"Descrição"}</span><textarea id="l-desc" data-l="desc">${esc(L.desc)}</textarea></label>`:""}
    </div>
    ${pv&&(pv.proj.length||pv.mens.length)?`<div class="diag preview">${!isGestao()?`<b>Você vai receber ${brlc(meu.filter(l=>!l.m).reduce((a,l)=>a+l.valor,0))}${meu.some(l=>l.m)?` + ${brlc(meu.filter(l=>l.m).reduce((a,l)=>a+l.valor,0))} por mês`:""}</b>`:"<b>Distribuição quando o cliente pagar</b>"}${linhasPrevia({...sv,parceiro:sv.parceiro})}<span class="hint">Antes de impostos e taxas do pagamento.${sv.equipe==="nfc"?" O custo das placas já foi descontado.":""}</span></div>`:""}
    <p class="hint late" id="lErr" hidden></p>
    <div class="row"><button type="button" class="btn" data-close>Cancelar</button><button class="btn primary" type="submit">${isGestao()?"Lançar e aprovar":"Enviar para aprovação"}</button></div>
  </form>`;
  $("#lf").addEventListener("submit",e=>{e.preventDefault();enviarLancamento()});
}
function enviarLancamento(){
  const L=lanc,err=t=>{$("#lErr").textContent=t;$("#lErr").hidden=false};
  if(!L.cli&&!L.novoCli.trim())return err("Escolha o cliente ou escreva o nome do novo cliente.");
  if(!L.tipo)return err("Escolha o serviço.");
  if(L.origem==="outro"&&!L.captador)return err("Escolha o colaborador que captou.");
  if(L.origem==="parceiro"&&!L.parceiro&&!L.novoParceiro.trim())return err("Escolha ou cadastre o parceiro.");
  const sv=svDoLanc();
  if(sv.equipe==="estrutura"&&!L.devs.length)return err("Marque pelo menos um desenvolvedor.");
  if(sv.equipe==="nfc"&&!L.nfc.length)return err("Adicione as placas do pedido.");
  if(!sv.unico&&!sv.mensal)return err("Informe o valor do projeto ou a mensalidade.");
  if(captacaoFixa(sv)&&sv.unico>0&&feeCaptacao(sv)>(sv.equipe==="estrutura"?cents(sv.unico)*REGRA.projNevora/10000:cents(sv.unico)-nfcTotal(sv,"custo")))return err("A comissão de captação passa da parte da Névora no projeto.");
  let c=L.cli?cliById(+L.cli):null;
  if(!c){c={id:Math.max(0,...state.clientes.map(x=>x.id))+1,nome:L.novoCli.trim(),seg:"",cidade:"",contato:"",ig:"",seg_ig:0,site:"nao",wpp:"comum",wppNum:"",status:"Em negociação",obs:"",servicos:[],hist:[{em:d(0),txt:"Cliente cadastrado por "+state.me}]};state.clientes.push(c)}
  if(L.origem==="parceiro"&&!L.parceiro){const p={id:Math.max(0,...state.parceiros.map(x=>x.id))+1,nome:L.novoParceiro.trim()};state.parceiros.push(p);sv.parceiro=p.id}
  const s={...sv,id:Math.max(0,...allSv().map(x=>x.id))+1,resp:sv.equipe==="estrutura"?L.devs[0]:(person(state.me)?.equipe===sv.equipe?state.me:COLABS.find(n=>person(n).equipe===sv.equipe)||state.me),etapa:0,dia:+L.dia||10,inicio:L.inicio,desc:L.desc,status:"pendente",criadoPor:state.me,atualiza:L.tipo==="cardapio"?L.atualiza:undefined,grafica:sv.equipe==="nfc"?"Gráfica Ponto Certo":undefined};
  c.servicos.push(s);c.hist.push({em:d(0),txt:state.me+" lançou "+svNome(s)+" · captação: "+origemTxt(s)});log("lançou "+svNome(s)+" para "+c.nome);
  if(isGestao())ativarServico(state,c,s);
  save();closeDrawer();render();toast(isGestao()?"Projeto lançado e aprovado":"Enviado para a Gestão aprovar");
}

/* ---------- janelas financeiras ---------- */
function modal(titulo,corpo,onOk,okTxt){
  $("#layer").innerHTML=`<div class="scrim" data-close></div><form class="drawer narrow" id="mf" autocomplete="off"><div class="dhead"><h2>${titulo}</h2><button type="button" class="btn" data-close>Fechar</button></div>${corpo}<p class="hint late" id="mErr" hidden></p><div class="row"><button type="button" class="btn" data-close>Cancelar</button><button class="btn primary" type="submit">${okTxt}</button></div></form>`;
  $("#mf").addEventListener("submit",e=>{e.preventDefault();const r=onOk(new FormData(e.target));if(r&&r.erro){$("#mErr").textContent=r.erro;$("#mErr").hidden=false;return}save();closeDrawer();render()});
}
function abrirRecebimento(pid){
  const p=state.pag.find(x=>x.id===pid),c=cliById(p.cli),s=svById(c,p.sv),saldo=saldoPag(state,p);
  modal("Registrar recebimento",`<p class="sub"><b>${esc(c.nome)}</b> · ${esc(p.desc)} · saldo ${brlc(saldo)}</p>
  <div class="form">
    <label class="field"><span>Valor recebido (R$)</span><input id="r-valor" name="valor" type="number" step="0.01" min="0.01" value="${(saldo/100).toFixed(2)}" required></label>
    <label class="field"><span>Data</span><input id="r-em" name="em" type="date" value="${d(0)}"></label>
    <label class="field"><span>Impostos (R$)</span><input id="r-imp" name="imp" type="number" step="0.01" min="0" value="0"></label>
    <label class="field"><span>Taxas do pagamento (R$)</span><input id="r-tax" name="tax" type="number" step="0.01" min="0" value="0"></label>
    <label class="field"><span>Custos diretos (R$)</span><input id="r-custo" name="custo" type="number" step="0.01" min="0" placeholder="${s.equipe==="nfc"?"Automático: custo das placas":"0"}"></label>
    <label class="field"><span>Forma</span><select id="r-forma" name="forma"><option>PIX</option><option>Boleto</option><option>Cartão</option><option>Transferência</option><option>Dinheiro</option></select></label>
    <label class="field full"><span>Referência da transação</span><input id="r-ref" name="ref" placeholder="ID do banco ou gateway: evita registrar duas vezes"></label>
  </div>`,
  fd=>receber(state,pid,{valor:fd.get("valor"),imp:fd.get("imp"),tax:fd.get("tax"),custo:fd.get("custo"),forma:fd.get("forma"),ref:fd.get("ref").trim(),em:fd.get("em")}),"Confirmar recebimento");
}
function abrirEstorno(rid){
  const r=state.rec.find(x=>x.id===rid),p=state.pag.find(x=>x.id===r.pag);
  modal("Estornar recebimento",`<p class="sub">${esc(cliById(p.cli).nome)} · ${esc(p.desc)} · ${brlc(r.valor)} recebido em ${fmtD(r.em)}</p><p class="hint">O lançamento original fica no histórico. São criados ajustes negativos para todos que receberam.</p><label class="field"><span>Motivo</span><textarea id="e-motivo" name="motivo" required placeholder="Ex.: chargeback do cartão"></textarea></label>`,
  fd=>{const m=fd.get("motivo").trim();if(m.length<5)return {erro:"Descreva o motivo do estorno."};return estornar(state,rid,m)},"Estornar");
}
function abrirRepasse(){
  const ids=state.selRep||[],l0=state.com.find(c=>c.id===ids[0]),tot=state.com.filter(c=>ids.includes(c.id)).reduce((a,c)=>a+c.valor,0);
  modal("Registrar repasse",`<p class="sub">${esc(nomeBenef(l0))} · ${ids.length} comissões · <b>${brlc(tot)}</b></p><p class="hint">Só marque como pago depois que a transferência for feita.</p>
  <div class="form"><label class="field"><span>Data da transferência</span><input id="p-em" name="em" type="date" value="${d(0)}"></label><label class="field"><span>Forma</span><select id="p-forma" name="forma"><option>PIX</option><option>Transferência</option><option>Dinheiro</option></select></label>
  <label class="field full"><span>Referência da transação</span><input id="p-ref" name="ref"></label></div>`,
  fd=>{const r=repassar(state,chaveBenef(l0),ids,{em:fd.get("em"),forma:fd.get("forma"),ref:fd.get("ref").trim()});if(r.ok)state.selRep=[];return r},"Confirmar repasse");
}
function abrirRecusa(cid,sid){
  const c=cliById(cid),s=svById(c,sid);
  modal("Recusar projeto",`<p class="sub">${esc(c.nome)} · ${svNome(s)} · lançado por ${esc(s.criadoPor)}</p><label class="field"><span>Motivo (aparece para quem lançou)</span><textarea id="x-motivo" name="motivo" required></textarea></label>`,
  fd=>{const m=fd.get("motivo").trim();if(m.length<5)return {erro:"Escreva o motivo."};s.status="recusado";s.motivoRecusa=m;c.hist.push({em:d(0),txt:"Gestão recusou "+svNome(s)+": "+m});log("recusou "+svNome(s)+" de "+c.nome);return {ok:1}},"Recusar");
}

/* ---------- ficha do cliente ---------- */
let draft;
function openClient(id){draft=structuredClone(cliById(id));drawDrawer()}
function drawDrawer(){
  const c=draft,G=isGestao(),pode=G||c.servicos.some(s=>s.criadoPor===state.me);
  const radio=(name,opts)=>`<div class="seg">${opts.map(([v,l])=>`<label><input type="radio" name="${name}" value="${v}" ${c[name]===v?"checked":""}>${l}</label>`).join("")}</div>`;
  const servs=c.servicos.filter(s=>G||participa(s,state.me));
  $("#layer").innerHTML=`<div class="scrim" data-close></div>
  <form class="drawer" id="cf" autocomplete="off">
    <div class="dhead"><div><h2>${esc(c.nome)}</h2><p class="sub">${c.status}</p></div><button type="button" class="btn" data-close>Fechar</button></div>
    <fieldset class="form" ${pode?"":"disabled"} style="border:0;padding:0;margin:0">
      <label class="field full"><span>Nome do cliente / empresa</span><input id="f-nome" name="nome" required value="${esc(c.nome)}"></label>
      <label class="field"><span>Segmento</span><input id="f-seg" name="seg" value="${esc(c.seg)}"></label>
      <label class="field"><span>Cidade</span><input id="f-cidade" name="cidade" value="${esc(c.cidade)}"></label>
      <label class="field"><span>Pessoa de contato</span><input id="f-contato" name="contato" value="${esc(c.contato)}"></label>
      <label class="field"><span>Status</span><select id="f-status" name="status">${STATUS_CLI.map(o=>`<option ${o===c.status?"selected":""}>${o}</option>`).join("")}</select></label>
      <label class="field"><span>Instagram (@)</span><input id="f-ig" name="ig" value="${esc(c.ig)}"></label>
      <label class="field"><span>Seguidores</span><input id="f-segig" name="seg_ig" type="number" min="0" value="${c.seg_ig}"></label>
      <div class="field full"><span>Tem site?</span>${radio("site",[["sim","Sim"],["desatualizado","Desatualizado"],["nao","Não"]])}</div>
      <div class="field full"><span>WhatsApp</span>${radio("wpp",[["business","Business"],["comum","Comum"],["nao","Não tem"]])}</div>
      <label class="field full"><span>Número do WhatsApp</span><input id="f-wppnum" name="wppNum" value="${esc(c.wppNum)}"></label>
    </fieldset>
    <div class="row" style="justify-content:space-between"><h3>Projetos</h3><button type="button" class="btn sm" data-act="lancarCli">Lançar projeto para este cliente</button></div>
    <div class="svlist">${servs.map(s=>{const ts=state.tar.filter(t=>t.sv===s.id&&t.cli===c.id);return `<div class="svitem" style="${tc(s.equipe)}"><div><div class="t">${svNome(s)} ${s.status==="pendente"?'<span class="chip wa">Aguardando aprovação</span>':s.status==="recusado"?'<span class="chip no">Recusado</span>':""}</div>
      <div class="s">Captação: <b>${esc(origemTxt(s))}</b>${captacaoFixa(s)?" ("+brlc(feeCaptacao(s))+")":""} · lançado por ${esc(s.criadoPor)}${s.equipe==="estrutura"?"<br>Produção: "+s.devs.join(", "):""}${s.nfc?"<br>"+nfcResumo(s):""}${s.status==="ativo"?" · <b>"+etapaNome(s)+"</b>":""}${s.motivoRecusa?"<br>Motivo: "+esc(s.motivoRecusa):""}</div>
      ${ts.length?`<ul class="minitasks">${ts.map(t=>`<li class="${t.status==="concluida"?"done":""}"><button type="button" class="linkbtn" data-tarefa="${t.id}">${esc(t.titulo)}</button> <span class="sub">${t.resp?esc(t.resp.split(" ")[0]):"livre"} · ${fmtD(t.prazo)}</span></li>`).join("")}</ul>`:""}</div>
      <div class="v">${s.equipe==="nfc"?brlc(nfcTotal(s,"preco"))+" venda<br>":s.unico?brl(s.unico)+" projeto<br>":""}${s.mensal?brl(s.mensal)+"/mês":"sem mensalidade"}</div></div>`}).join("")||'<p class="hint">Nenhum projeto ainda.</p>'}</div>
    ${G?`<h3>Cobranças</h3><div class="tablewrap"><table style="min-width:0"><tbody>${state.pag.filter(p=>p.cli===c.id).sort((a,b)=>b.venc.localeCompare(a.venc)).map(p=>`<tr><td style="font-family:var(--mono)">${fmtD(p.venc)}</td><td>${esc(p.desc)}</td><td class="num">${brl(p.valor)}</td><td>${pill(pStatus(p))}</td></tr>`).join("")||'<tr><td class="empty">Sem cobranças.</td></tr>'}</tbody></table></div>`:""}
    <label class="field"><span>Observações</span><textarea id="f-obs" name="obs" ${pode?"":"disabled"}>${esc(c.obs)}</textarea></label>
    ${c.hist.length?`<h3>Histórico</h3><ul class="hist">${c.hist.slice().reverse().map(h=>`<li><time>${fmtD(h.em)}</time>${esc(h.txt)}</li>`).join("")}</ul>`:""}
    <div class="row"><button type="button" class="btn" data-close>${pode?"Cancelar":"Fechar"}</button>${pode?'<button class="btn primary" type="submit">Salvar</button>':""}</div>
  </form>`;
  $("#cf").addEventListener("submit",e=>{e.preventDefault();const fd=new FormData(e.target);["nome","seg","cidade","contato","status","ig","site","wpp","wppNum","obs"].forEach(k=>{if(fd.has(k))draft[k]=fd.get(k).toString().trim()});draft.seg_ig=+fd.get("seg_ig")||0;const i=state.clientes.findIndex(x=>x.id===draft.id);state.clientes[i]={...state.clientes[i],...draft,servicos:state.clientes[i].servicos};save();closeDrawer();render();toast("Cliente salvo")});
}
function closeDrawer(){$("#layer").innerHTML="";draft=null}

/* ---------- arrastar e soltar ---------- */
function bindDnD(){
  document.querySelectorAll(".card").forEach(el=>el.addEventListener("dragstart",e=>e.dataTransfer.setData("text/plain",el.dataset.sv)));
  document.querySelectorAll(".col").forEach(col=>{
    col.addEventListener("dragover",e=>{e.preventDefault();col.classList.add("over")});
    col.addEventListener("dragleave",()=>col.classList.remove("over"));
    col.addEventListener("drop",e=>{e.preventDefault();col.classList.remove("over");
      const [cid,sid]=e.dataTransfer.getData("text/plain").split(":").map(Number);const c=cliById(cid),s=svById(c,sid);const et=+col.dataset.etapa;
      if(s&&s.etapa!==et){s.etapa=et;c.hist.push({em:d(0),txt:state.me+" moveu "+svNome(s)+" para "+etapaNome(s)});log("moveu "+svNome(s)+" de "+c.nome);save();render();toast("Movido para "+etapaNome(s))}});
  });
}

/* ---------- eventos ---------- */
document.addEventListener("click",e=>{
  const t=e.target;
  const v=t.closest("[data-view]");if(v){state.view=v.dataset.view;save();render();return}
  const tm=t.closest("[data-team]");if(tm){state.team=tm.dataset.team;render();return}
  const fp=t.closest("[data-fpag]");if(fp){state.fPag=fp.dataset.fpag;render();return}
  const rb=t.closest("[data-receber]");if(rb){abrirRecebimento(+rb.dataset.receber);return}
  const es=t.closest("[data-estornar]");if(es){abrirEstorno(+es.dataset.estornar);return}
  const ap=t.closest("[data-aprovar]");if(ap){const [ci,si]=ap.dataset.aprovar.split(":").map(Number);const c=cliById(ci);ativarServico(state,c,svById(c,si));save();render();toast("Projeto aprovado: cobranças e tarefas criadas");return}
  const rc=t.closest("[data-recusar]");if(rc){const [ci,si]=rc.dataset.recusar.split(":").map(Number);abrirRecusa(ci,si);return}
  const sl=t.closest("[data-sel]");if(sl){const id=+sl.dataset.sel,linha=state.com.find(c=>c.id===id);let s=state.selRep||[];
    if(sl.checked){if(s.length&&chaveBenef(state.com.find(c=>c.id===s[0]))!==chaveBenef(linha)){s=[];toast("Repasse é por pessoa: seleção anterior limpa")}s=[...s,id]}else s=s.filter(x=>x!==id);state.selRep=s;render();return}
  const td=t.closest("[data-tdone]");if(td){const x=state.tar.find(y=>y.id===+td.dataset.tdone);setStatusTarefa(x,td.checked?"concluida":"a_fazer");return}
  const as=t.closest("[data-assumir]");if(as){const x=state.tar.find(y=>y.id===+as.dataset.assumir);x.resp=state.me;log("assumiu "+x.titulo);save();render();toast("Tarefa com você");return}
  const tr=t.closest("[data-tarefa]");if(tr){abrirTarefa(+tr.dataset.tarefa);return}
  const cm=t.closest("[data-comentar]");if(cm){const x=state.tar.find(y=>y.id===+cm.dataset.comentar),txt=$("#t-com").value.trim();if(!txt)return;x.comentarios.push({autor:state.me,texto:txt,em:d(0)});save();abrirTarefa(x.id);return}
  const at=t.closest("[data-apagartar]");if(at){state.tar=state.tar.filter(y=>y.id!==+at.dataset.apagartar);save();closeDrawer();render();return}
  const nr=t.closest("[data-nfcrm]");if(nr){lanc.nfc.splice(+nr.dataset.nfcrm,1);drawLancamento();return}
  const act=t.closest("[data-act]")?.dataset.act;
  if(act==="limparSel"){state.selRep=[];render();return}
  if(act==="repasse"){abrirRepasse();return}
  if(act==="lancar"){abrirLancamento();return}
  if(act==="lancarCli"){abrirLancamento(draft.id);return}
  if(act==="novaTarefa"){abrirTarefa(null);return}
  if(act==="aprovacoes"){state.view="aprovacoes";render();return}
  if(act==="nfcadd"){lanc.nfc.push({t:"google",q:1,...NFC_PADRAO});drawLancamento();return}
  if(t.closest("[data-close]")){closeDrawer();return}
  const o=t.closest("[data-open]");if(o&&!t.closest(".drawer")){e.preventDefault();openClient(+o.dataset.open)}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeDrawer()});
const FC={fcBenef:"benef",fcCli:"cli",fcOrigem:"origem",fcStatus:"status",fcDe:"de",fcAte:"ate"};
function lancInput(el){
  if(el.dataset.l){lanc[el.dataset.l]=el.value;return true}
  if(el.dataset.dev){lanc.devs=DEVS.filter(n=>n===el.dataset.dev?el.checked:lanc.devs.includes(n));return true}
  if(el.dataset.nfc!==undefined&&el.dataset.k){const n=lanc.nfc[+el.dataset.nfc];n[el.dataset.k]=el.dataset.k==="t"?el.value:+el.value;return true}
  return false;
}
function redrawLanc(el){const id=el.id,pos=el.selectionStart,nfcKey=el.dataset.nfc!==undefined?`[data-nfc="${el.dataset.nfc}"][data-k="${el.dataset.k}"]`:null;drawLancamento();const back=id?$("#"+id):nfcKey?$(nfcKey):null;if(back&&el.type!=="radio"&&el.type!=="checkbox"&&el.tagName!=="SELECT"){back.focus();try{back.setSelectionRange(pos,pos)}catch(e){}}}
document.addEventListener("change",e=>{
  const el=e.target,id=el.id;
  if(el.closest("#lf")&&lancInput(el)){redrawLanc(el);return}
  if(id==="me"){state.me=e.target.value;state.selRep=[];state.ft=null;state.view=isGestao()?"geral":"tarefas";const t=myTeam();if(t)state.team=t;save();render()}
  if(id==="soMeus"){state.soMeus=el.checked;render()}
  if(id==="ftPessoa"){state.ft.pessoa=el.value;render()}
  if(id==="ftSetor"){state.ft.setor=el.value;render()}
  if(FC[id]){state.fc[FC[id]]=el.value;render()}
  if(id==="fcNev"){state.fc.mostrarNevora=el.checked;render()}
});
document.addEventListener("input",e=>{
  const el=e.target;
  if(el.closest("#lf")&&(el.type==="number"||el.type==="text"||el.tagName==="TEXTAREA")){lancInput(el);if(el.type==="number")redrawLanc(el);return}
  if(el.id==="q"){state.q=el.value;const pos=el.selectionStart;render();const q=$("#q");q.focus();q.setSelectionRange(pos,pos)}
});
let state;
const save=()=>{try{localStorage.setItem("nevora-demo-v6",JSON.stringify(state))}catch(e){}};
try{state=JSON.parse(localStorage.getItem("nevora-demo-v6"))}catch(e){}
if(!state||!state.tar)state=seed();
render();

</script>
